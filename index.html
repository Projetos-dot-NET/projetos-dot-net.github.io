<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projetos .NET</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bold: #f0f6fc;
      --accent: #58a6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      color: var(--text-bold);
      margin-bottom: 30px;
      font-size: 1.8rem;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 900px;
    }

    .repo-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.2s, transform 0.1s;
    }

    .repo-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .repo-icon {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      background-color: var(--border);
      flex-shrink: 0;
    }

    .repo-info {
      overflow: hidden;
    }

    .repo-name {
      color: var(--accent);
      font-weight: 600;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .repo-desc {
      font-size: 0.85rem;
      color: #8b949e;
      margin-top: 4px;
    }

    .error-msg {
      color: #f85149;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h1>Repositórios</h1>
  <main class="grid-container" id="repo-list"></main>

  <script>
    const container = document.getElementById('repo-list');

    fetch('./dados.json')
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }
        return response.json();
      })
      .then(repositories => {
        repositories.forEach(repo => {
          const card = document.createElement('a');
          card.className = 'repo-card';
          card.href = repo.url;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';

          card.innerHTML = `
            <img class="repo-icon" src="${repo.image}" alt="Ícone de ${repo.name}" onerror="this.src='https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png'">
            <div class="repo-info">
              <div class="repo-name">${repo.name}</div>
              <div class="repo-desc">Acessar projeto →</div>
            </div>
          `;

          container.appendChild(card);
        });
      })
      .catch(error => {
        container.innerHTML = `<p class="error-msg">Erro ao carregar dados: ${error.message}</p>`;
      });
  </script>
</body>
</html>
